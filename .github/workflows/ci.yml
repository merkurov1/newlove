name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test --runInBand

  browser:
    name: Browser behavior (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The stable browser set: modal geometry at every registered viewport,
      # real Recharts/diagram SVG at desktop/iPad/mobile, long transcript and
      # 500+ history anchoring, live-stream scroll position, interruption and
      # reconnect. Every chat turn is served by a local fixture; no production
      # chat is written.
      - name: Pierrot browser regression suite
        run: pnpm test:pierrot
        env:
          CI: 'true'

      - name: Upload Playwright traces, screenshots and videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pierrot-playwright-${{ github.run_attempt }}
          path: |
            test-results/pierrot
            playwright-report/pierrot
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build must not depend on production secrets. Public Supabase values
      # are placeholders: static generation degrades gracefully (it logs a
      # fetch error and renders the empty state) instead of failing the build.
      # Route handlers are dynamic and read the real values at runtime.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: pnpm build

  executor:
    name: Actions executor checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check executor scripts
        run: |
          node --check scripts/pierrot/dev-worker.mjs
          node --check scripts/pierrot/dev-worker-lib.mjs
          node --check scripts/pierrot/actions-preflight.mjs

      - name: Executor unit tests
        run: |
          node --test \
            scripts/pierrot/__tests__/dev-worker-lib.test.mjs \
            scripts/pierrot/__tests__/actions-executor.test.mjs

  migration:
    name: Migration apply and rollback
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migration, verify helper, rollback and re-apply
        env:
          BRAIN_HNSW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/brain
          BRAIN_HNSW_TEST_NO_SSL: 'true'
        run: node scripts/knowledge/verify-brain-hnsw-migration.mjs
