# pnpm settings for a single-package repository.
#
# Native packages are allowed to run their build scripts explicitly instead of
# approving them interactively. Keep this list minimal: every entry is a
# package that ships or builds a native binary used at runtime or build time.
allowBuilds:
  '@reown/appkit': true
  '@swc/core': true
  '@vercel/speed-insights': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
