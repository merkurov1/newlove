<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Heart &amp; Angel — Offline</title>
    <link
      rel="icon"
      href="/heartandangel/icons/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #141210;
        --muted: #6f675e;
        --paper: #faf8f5;
        --line: rgba(20, 18, 16, 0.14);
        --accent: #a8402c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 36%, rgba(168, 64, 44, 0.1), transparent 48%),
          var(--paper);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }

      main {
        width: min(100%, 32rem);
        border: 1px solid var(--line);
        border-radius: 1.75rem;
        padding: clamp(1.5rem, 6vw, 2.75rem);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 30px 90px rgba(20, 18, 16, 0.12);
        backdrop-filter: blur(14px);
      }

      img {
        display: block;
        width: 92px;
        height: 92px;
        margin: 0 auto 1.5rem;
        border-radius: 22px;
        box-shadow: 0 14px 35px rgba(20, 18, 16, 0.18);
      }

      .eyebrow {
        margin: 0 0 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 3.1rem);
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: 0.01em;
      }

      p {
        margin: 1.25rem auto 0;
        max-width: 26rem;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .note {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        line-height: 1.7;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8a8176;
      }

      button {
        margin-top: 1.5rem;
        min-height: 48px;
        width: 100%;
        border: 1px solid rgba(168, 64, 44, 0.55);
        border-radius: 999px;
        padding: 0.8rem 1.4rem;
        background: rgba(168, 64, 44, 0.1);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: rgba(168, 64, 44, 0.2);
        outline: 2px solid rgba(20, 18, 16, 0.45);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/heartandangel/icons/icon-192.png"
        alt=""
        width="92"
        height="92"
      />
      <p class="eyebrow">Heart &amp; Angel</p>
      <h1>The Temple is unreachable.</h1>
      <p>
        The connection has gone quiet. Heart &amp; Angel is still here — return
        when the network does.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <p class="note">
        Rituals and payments need a connection. Nothing is saved offline.
      </p>
    </main>
  </body>
</html>
